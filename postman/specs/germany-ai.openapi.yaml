openapi: 3.0.3
info:
  title: Germany coverage, maps and logistics AI
  version: 1.1.0
  description: Manual Germany location confirmation and read-only AI assistance. Map pins are dispatcher-entered, not live GPS or route/ETA estimates.
# Production profile: Basic over HTTPS plus X-XSRF-TOKEN on writes.
security:
  - basicAuth: []
components:
  securitySchemes:
    basicAuth: { type: http, scheme: basic }
paths:
  /api/v1/health:
    get:
      security: []
      responses:
        '200': { description: Database reachable; status UP only. }
        '503': { description: Database unavailable; status DOWN only. }
  /api/v1/germany/orders/{id}/lookup:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      description: Searches saved addresses via Photon only for missing pins. Never writes geography. Returns address snapshots and per-stop status (FOUND, NO_MATCH, UNAVAILABLE or SAVED) with up to three draft candidates (label, lat, lng, state). Country is restricted to DE. Results require dispatcher verification. Cached and throttled on the backend.
      responses:
        '200': { description: Object containing pickupAddress, deliveryAddress, pickup and delivery. Each stop has status and candidates. Suggested coordinates are not confirmed locations. }
        '404': { description: Order not found. }
  /api/v1/germany/config:
    get:
      responses:
        '200': { description: Germany state codes, map tile URL and attribution. }
  /api/v1/germany/orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      responses:
        '200': { description: Saved pins and states, or empty pins. Address edits invalidate saved geography. }
        '404': { description: Order missing. }
    put:
      description: Saves manually confirmed Germany pins and state codes for a pending order; checks assigned-driver coverage. Coordinate bounds are a coarse sanity check, not border validation. Address snapshots and versions prevent stale saves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupState, deliveryState, pickupLat, pickupLng, deliveryLat, deliveryLng, germanyConfirmed, pickupAddress, deliveryAddress]
              properties:
                version: { type: integer, format: int64, nullable: true, description: Null for new locations. Send the version returned by GET for updates; stale versions return 409. }
                pickupState: { type: string, pattern: '^[A-Z]{2}$' }
                deliveryState: { type: string, pattern: '^[A-Z]{2}$' }
                pickupLat: { type: number, minimum: 47.2, maximum: 55.1 }
                deliveryLat: { type: number, minimum: 47.2, maximum: 55.1 }
                pickupLng: { type: number, minimum: 5.8, maximum: 15.1 }
                deliveryLng: { type: number, minimum: 5.8, maximum: 15.1 }
                germanyConfirmed: { type: boolean, enum: [true] }
                pickupAddress: { type: string, maxLength: 255 }
                deliveryAddress: { type: string, maxLength: 255 }
      responses:
        '200': { description: Saved geography. }
        '400': { description: Missing confirmation, invalid coordinates or unsupported state. }
        '404': { description: Order missing. }
        '409': { description: Order no longer pending, address changed or assigned driver does not cover both states. }
  /api/v1/germany/drivers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      responses:
        '200': { description: Array of Germany state codes served by driver; empty means not configured. }
        '404': { description: Driver missing. }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, maxItems: 16, uniqueItems: true, items: { type: string } }
      responses:
        '200': { description: Saved state codes. Does not reassign existing orders. }
        '400': { description: Invalid state codes. }
        '404': { description: Driver missing. }
  /api/v1/ai/tools:
    get:
      responses:
        '200': { description: Ten tools with ID, title, description, requiresOrder and requiresText. }
  /api/v1/ai/run:
    post:
      description: Reads saved facts and optionally generates Groq guidance. Never changes orders, sends messages, or assigns drivers. Text translation explicitly sends user-entered text to Groq. Do not retry automatically. Missing credentials/provider failure returns LOCAL source; translation is unavailable rather than fabricated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toolId, language]
              properties:
                toolId: { type: string, enum: [DISPATCH_BRIEF, ORDER_BRIEF, DRIVER_MATCH, DELAY_TRIAGE, CAPACITY_PLAN, FAIRNESS_REVIEW, HANDOVER, CUSTOMER_UPDATE, TRANSLATE, DELIVERY_CHECKLIST] }
                orderId: { type: integer, format: int64, nullable: true }
                text: { type: string, maxLength: 3000 }
                language: { type: string, enum: [DE, EN] }
      responses:
        '200':
          description: Reviewable output; source distinguishes AI from deterministic LOCAL guidance.
          content:
            application/json:
              schema:
                type: object
                required: [toolId, title, source, content, facts, generatedAt]
                properties:
                  toolId: { type: string }
                  title: { type: string }
                  source: { type: string, enum: [AI, LOCAL] }
                  content: { type: string }
                  facts: { type: string }
                  generatedAt: { type: string, format: date-time }
        '400': { description: Unknown tool, invalid language, missing order/text or excessive text. }
        '404': { description: Selected order missing. }
        '409': { description: Selected order is ineligible for driver matching. }
