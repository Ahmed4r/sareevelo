openapi: 3.0.3
info:
  title: SAREEVELO Scheduled Order Workflows
  version: 1.2.0
  description: Creation, pending-order editing, and lifecycle transitions. Existing assignment and activity endpoints are not described by this scoped contract.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/orders:
    get:
      operationId: listOrders
      responses:
        '200':
          description: Saved orders, including terminal and unscheduled records.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Order' } }
    post:
      operationId: createOrder
      description: Generates a unique tracking number when omitted, null or blank. Optional manual tracking is retained for legacy clients. Past delivery windows are allowed. Do not automatically retry an uncertain POST.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OrderInput'
                - type: object
                  properties:
                    trackingNumber: { type: string, maxLength: 50, nullable: true }
      responses:
        '201': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { description: Tracking number already exists. }
  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '404': { description: Order does not exist. }
    put:
      operationId: editPendingOrder
      description: Replaces customer, addresses and schedule on a PENDING order. Missing/null window fields clear scheduling. Tracking number, driver, status and capacity are preserved. A real change records ORDER_UPDATED; identical retries do not add events. Concurrent writes are serialized; latest successful profile write wins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { description: Order does not exist. }
        '409': { description: Order is no longer pending. }
  /api/v1/orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    patch:
      operationId: changeOrderStatus
      description: Pending assigned orders may start; in-transit orders may be delayed or completed; delayed orders may resume or complete. Any unfinished order may be cancelled, including unassigned orders. Repeating the current status is a no-op. Delivered and cancelled orders cannot reopen. Cancellation retains the record and historical driver ID, records ORDER_CANCELLED, and releases one reserved space atomically. Offline drivers remain offline. Competing completion/cancellation permits only one terminal transition and one capacity release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/Status' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { description: Order does not exist. }
        '409':
          description: Invalid transition, offline/missing driver, missing assignment or inconsistent capacity. No changes are committed.
components:
  parameters:
    OrderId:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Order:
      description: Persisted order.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Order' }
    Invalid:
      description: Invalid fields, malformed timestamps, incomplete window or window end not after start.
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              fieldErrors: { type: object, additionalProperties: { type: string } }
  schemas:
    Status:
      type: string
      enum: [PENDING, IN_TRANSIT, DELAYED, DELIVERED, CANCELLED]
    OrderInput:
      type: object
      required: [customerName, pickupAddress, deliveryAddress]
      description: Both window endpoints must be supplied together or both absent/null. They must be ISO-8601 instants with timezone offset, and the end must be later than the start. Overdue and due-today indicators are calculated by the UI and do not alter manual delay status.
      properties:
        customerName: { type: string, minLength: 1, maxLength: 150 }
        pickupAddress: { type: string, minLength: 1, maxLength: 255 }
        deliveryAddress: { type: string, minLength: 1, maxLength: 255 }
        deliveryWindowStart: { type: string, format: date-time, nullable: true, example: '2026-11-02T09:00:00Z' }
        deliveryWindowEnd: { type: string, format: date-time, nullable: true, example: '2026-11-02T11:00:00Z' }
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderInput'
        - type: object
          required: [id, trackingNumber, status, driverId]
          properties:
            id: { type: integer, format: int64 }
            trackingNumber: { type: string }
            status: { $ref: '#/components/schemas/Status' }
            driverId: { type: integer, format: int64, nullable: true }
