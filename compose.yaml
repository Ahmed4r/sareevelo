name: sareevelo
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sareevelo
      POSTGRES_USER: sareevelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/sareevelo
      DB_USER: sareevelo
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      SERVER_ADDRESS: 127.0.0.1
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    # Nginx shares this namespace and listens on 8080. Java's 9090 stays private.
    ports: ['127.0.0.1:${APP_PORT:-3000}:8080']
    networks: [database, outbound]
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    restart: unless-stopped
  frontend:
    build: ./frontend
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    restart: unless-stopped
volumes:
  postgres-data:
networks:
  database:
    internal: true
  outbound:
