# Set these explicitly in the deployment environment. No built-in accounts.
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
dispatch.security.dispatcher-user=${DISPATCHER_USER}
dispatch.security.dispatcher-password-hash=${DISPATCHER_PASSWORD_HASH}
dispatch.security.viewer-user=${VIEWER_USER}
dispatch.security.viewer-password-hash=${VIEWER_PASSWORD_HASH}
