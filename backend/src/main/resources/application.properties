spring.application.name=sareevelo-backend
# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sareevelo_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server
server.port=9090
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Local demo binds only to loopback; use the production profile behind HTTPS.
server.address=127.0.0.1
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=32KB
