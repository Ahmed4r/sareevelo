name: Build checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sareevelo_test
          POSTGRES_USER: sareevelo_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sareevelo_test -d sareevelo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: npm ci
        working-directory: frontend
      - run: npm run build:production
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Verify backend workflows on PostgreSQL
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/sareevelo_test
          TEST_DB_USER: sareevelo_test
          TEST_DB_PASSWORD: ci-test-only
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
      - name: Validate Compose and build containers
        env:
          POSTGRES_PASSWORD: ci-build-only
        run: |
          docker compose config --quiet
          docker compose build
